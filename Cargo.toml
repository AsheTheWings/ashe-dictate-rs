[package]
name = "ashe-dictate-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
cpal = "0.17.3"
crossbeam-channel = "0.5.15"
deepgram = "0.9.2"
dotenvy = "0.15.7"
futures = "0.3.32"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory"] }
